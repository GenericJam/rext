name: windows-native

# Builds the WinForms native renderer on a Windows runner. WinForms is
# Windows-only, so this is where its C# is verified (it can't compile on the
# macOS dev box). Compile only — the window's visual correctness is a human's
# pass on a real display (see PLAN.md).
#
# Also boots + drives the in-process NIF host (native/windows/host). Unlike
# the macOS host, this one needs no GUI session to verify — it's headless by
# design (see decisions/2026-08-07-in-process-nif-host-windows.md) — so CI can
# actually run it end-to-end, not just build-check it.

on:
  push:
    branches: [master]
    paths: ['native/windows/**', '.github/workflows/windows-native.yml']
  pull_request:
    paths: ['native/windows/**', '.github/workflows/windows-native.yml']
  workflow_dispatch:

concurrency:
  group: windows-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native/windows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build -c Release

  nif_host:
    name: In-process NIF host (boot + drive over dist)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20'
          otp-version: '29'
      - name: Install MinGW-w64
        run: choco install mingw -y --no-progress

      - run: mix deps.get
      - run: mix compile

      - name: Resolve OTP/Elixir paths (portable across setup-beam's install layout)
        id: paths
        shell: pwsh
        # elixir.bat is a batch wrapper; PowerShell invoking it with inline -e
        # code containing parens breaks cmd.exe's own command-line parsing
        # ("() was unexpected at this time.") -- writing the snippet to a file
        # instead sidesteps that class of quoting bug entirely. Must be
        # written via [System.IO.File]::WriteAllText, not Out-File -- pwsh's
        # "utf8" encoding still means UTF-8-with-BOM, and Elixir chokes on a
        # leading BOM ("unexpected token: ... U+FEFF").
        run: |
          $script = @'
          IO.puts("ERL_ROOT=" <> to_string(:code.root_dir()))
          IO.puts("ERTS_VSN=" <> to_string(:erlang.system_info(:version)))
          IO.puts("ELIXIR_EBIN=" <> to_string(:code.lib_dir(:elixir, :ebin)))
          IO.puts("LOGGER_EBIN=" <> to_string(:code.lib_dir(:logger, :ebin)))
          '@
          [System.IO.File]::WriteAllText("$PWD\resolve_paths.exs", $script)
          $out = elixir resolve_paths.exs
          Remove-Item "$PWD\resolve_paths.exs"

          $erlRoot = (($out | Select-String '^ERL_ROOT=').ToString() -replace '^ERL_ROOT=', '') -replace '\\', '/'
          $ertsVsn = ($out | Select-String '^ERTS_VSN=').ToString() -replace '^ERTS_VSN=', ''
          $elixirEbin = (($out | Select-String '^ELIXIR_EBIN=').ToString() -replace '^ELIXIR_EBIN=', '') -replace '\\', '/'
          $loggerEbin = (($out | Select-String '^LOGGER_EBIN=').ToString() -replace '^LOGGER_EBIN=', '') -replace '\\', '/'

          "erl_root=$erlRoot" >> $env:GITHUB_OUTPUT
          "erts_bin=$erlRoot/erts-$ertsVsn/bin" >> $env:GITHUB_OUTPUT
          "boot=$erlRoot/bin/start_clean" >> $env:GITHUB_OUTPUT
          "elixir_ebin=$elixirEbin" >> $env:GITHUB_OUTPUT
          "logger_ebin=$loggerEbin" >> $env:GITHUB_OUTPUT

      - name: Build the in-process host
        working-directory: native/windows/host
        shell: pwsh
        env:
          REXT_ERL_ROOT: ${{ steps.paths.outputs.erl_root }}
          REXT_ERTS_BIN: ${{ steps.paths.outputs.erts_bin }}
          REXT_BOOT: ${{ steps.paths.outputs.boot }}
          REXT_ELIXIR_EBIN: ${{ steps.paths.outputs.elixir_ebin }}
          REXT_LOGGER_EBIN: ${{ steps.paths.outputs.logger_ebin }}
        run: |
          $mingwBin = (Get-ChildItem "C:\ProgramData\mingw64" -Directory | Select-Object -First 1).FullName + "\bin"
          $env:PATH = "$mingwBin;$env:PATH"
          .\build.ps1

      - name: Boot the host and drive it over dist (fails loud on any mismatch)
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "native\windows\host\rext_host.exe" -PassThru `
            -RedirectStandardOutput "host.out.log" -RedirectStandardError "host.err.log"
          Start-Sleep -Seconds 5

          $check = @'
          node = :"rext_host@127.0.0.1"
          true = Node.connect(node)
          Rext.Examples.CounterWindow = :rpc.call(node, Rext.Test, :window, [node])
          %{count: 0} = :rpc.call(node, Rext.Test, :assigns, [node])
          :ok = :rpc.call(node, :rext_nif, :simulate_ui_event, ["main", "click", "inc"])
          Process.sleep(300)
          %{count: 1} = :rpc.call(node, Rext.Test, :assigns, [node])
          IO.puts("[nif_host CI check] boot + render + enif_send round trip OK")
          '@
          # WriteAllText, not Out-File -Encoding utf8: that still means
          # UTF-8-with-BOM in PowerShell, and Elixir chokes on a leading BOM.
          [System.IO.File]::WriteAllText("$PWD\ci_check_nif_host.exs", $check)

          try {
            elixir --name ci_checker@127.0.0.1 --cookie rext_secret -S mix run ci_check_nif_host.exs
          } finally {
            Get-Content "host.out.log", "host.err.log" -ErrorAction SilentlyContinue
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Remove-Item ci_check_nif_host.exs -ErrorAction SilentlyContinue
          }
